<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rustscape - Redirecting...</title>
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>"
        />
        <style>
            body {
                font-family: "Courier New", monospace;
                background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
                color: #fff;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                text-align: center;
            }

            .container {
                background: rgba(0, 0, 0, 0.6);
                padding: 40px;
                border-radius: 10px;
                border: 2px solid #ffcc00;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            }

            h1 {
                color: #ffcc00;
                font-size: 36px;
                margin-bottom: 20px;
                text-shadow: 2px 2px 4px #000;
            }

            p {
                color: #ccc;
                margin-bottom: 30px;
                font-size: 16px;
            }

            .links {
                display: flex;
                flex-direction: column;
                gap: 15px;
            }

            a {
                display: inline-block;
                padding: 15px 30px;
                background: linear-gradient(180deg, #5a5a5a 0%, #3a3a3a 100%);
                color: #ffcc00;
                text-decoration: none;
                border: 2px solid #000;
                border-radius: 5px;
                font-weight: bold;
                font-size: 16px;
                transition: all 0.3s ease;
            }

            a:hover {
                background: linear-gradient(180deg, #6a6a6a 0%, #4a4a4a 100%);
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(255, 204, 0, 0.3);
            }

            .spinner {
                border: 4px solid rgba(255, 204, 0, 0.3);
                border-top: 4px solid #ffcc00;
                border-radius: 50%;
                width: 40px;
                height: 40px;
                animation: spin 1s linear infinite;
                margin: 20px auto;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }

            .note {
                margin-top: 20px;
                font-size: 12px;
                color: #888;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>🎮 RUSTSCAPE</h1>
            <p>Welcome to Rustscape - A RuneScape-inspired MMORPG</p>
            <div class="spinner"></div>
            <p id="status">Redirecting to game client...</p>

            <div class="links">
                <a href="/game.html" id="game-link"
                    >🎮 Play Game (New Client)</a
                >
                <a href="/test-client.html">🧪 Test Client (Legacy)</a>
            </div>

            <div class="note">
                Click "Play Game" for the modern client with improved graphics
                and UI
            </div>
        </div>

        <script>
            // Auto-redirect to game client after 2 seconds
            setTimeout(() => {
                window.location.href = "/game.html";
            }, 2000);

            // Update status text
            let dots = 0;
            setInterval(() => {
                dots = (dots + 1) % 4;
                document.getElementById("status").textContent =
                    "Redirecting to game client" + ".".repeat(dots);
            }, 500);
        </script>
    </body>
</html>
