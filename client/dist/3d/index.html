<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rustscape - 3D Client</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #ffff00;
            overflow: hidden;
            user-select: none;
        }

        /* RuneScape Classic Color Scheme */
        :root {
            --rs-brown-darkest: #2e2822;
            --rs-brown-dark: #3e3529;
            --rs-brown-med: #524a3d;
            --rs-brown-light: #6b614e;
            --rs-stone: #4e4a40;
            --rs-gold: #d4a017;
            --rs-text-yellow: #ffff00;
            --rs-text-white: #ffffff;
            --rs-text-orange: #ff9040;
            --rs-text-cyan: #00ffff;
            --rs-text-red: #ff0000;
            --rs-text-green: #00ff00;
            --rs-border-light: #8b7355;
            --rs-border-dark: #1a1410;
        }

        #game-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            background: var(--rs-brown-darkest);
        }

        /* Main 3D Canvas Area (Left side) */
        #canvas-area {
            position: relative;
            flex: 1;
            background: #000;
            border-right: 3px solid var(--rs-gold);
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }

        /* Loading Screen */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #loading-screen.hidden {
            display: none;
        }

        .loading-logo {
            font-size: 48px;
            color: var(--rs-gold);
            text-shadow: 3px 3px 0 #000;
            margin-bottom: 20px;
        }

        .loading-bar {
            width: 400px;
            height: 30px;
            background: var(--rs-brown-darkest);
            border: 2px solid var(--rs-gold);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, var(--rs-gold) 0%, #ffdf40 50%, var(--rs-gold) 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .loading-text {
            margin-top: 15px;
            color: var(--rs-text-yellow);
            font-size: 14px;
        }

        /* Minimap Container (Top-right overlay) */
        #minimap-container {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 180px;
            height: 180px;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid var(--rs-border-light);
            border-radius: 50%;
            z-index: 100;
        }

        #minimap-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        #compass {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background: var(--rs-stone);
            border: 2px solid var(--rs-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--rs-text-red);
            cursor: pointer;
        }

        /* XP Orbs */
        #xp-orbs {
            position: absolute;
            top: 200px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }

        .xp-orb {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid var(--rs-gold);
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.3), transparent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            position: relative;
        }

        .xp-orb.hp { background-color: #aa0000; }
        .xp-orb.prayer { background-color: #0088aa; }
        .xp-orb.run { background-color: #aaaa00; }

        .orb-value {
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }

        /* Right Sidebar */
        #sidebar {
            width: 250px;
            background: var(--rs-brown-dark);
            border-left: 3px solid var(--rs-border-dark);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Tab Buttons */
        #tab-buttons {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: var(--rs-brown-med);
            border-bottom: 3px solid var(--rs-border-dark);
        }

        .tab-btn {
            aspect-ratio: 1;
            background: var(--rs-stone);
            border: 2px solid var(--rs-border-dark);
            cursor: pointer;
            font-size: 20px;
            transition: all 0.2s;
            position: relative;
        }

        .tab-btn:hover {
            background: var(--rs-brown-light);
            transform: scale(1.05);
        }

        .tab-btn.active {
            background: var(--rs-brown-light);
            border-color: var(--rs-gold);
            box-shadow: inset 0 0 5px rgba(212, 160, 23, 0.5);
        }

        /* Tab Content */
        #tab-content {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            background: var(--rs-brown-dark);
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        .panel-title {
            color: var(--rs-text-yellow);
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
            text-shadow: 2px 2px 0 #000;
        }

        /* Inventory Grid */
        #inventory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .inventory-slot {
            aspect-ratio: 1;
            background: var(--rs-brown-darkest);
            border: 2px solid var(--rs-border-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }

        .inventory-slot:hover {
            border-color: var(--rs-gold);
            background: var(--rs-brown-med);
        }

        .item-count {
            position: absolute;
            bottom: 2px;
            right: 4px;
            color: var(--rs-text-yellow);
            font-size: 10px;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
        }

        /* Skills List */
        #skills-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .skill-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px;
            background: var(--rs-brown-darkest);
            border: 1px solid var(--rs-border-dark);
        }

        .skill-row:hover {
            background: var(--rs-brown-med);
        }

        .skill-name {
            color: var(--rs-text-yellow);
            font-size: 12px;
        }

        .skill-level {
            color: var(--rs-text-white);
            font-weight: bold;
        }

        /* Equipment Panel */
        #equipment-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 5px;
            padding: 10px;
        }

        .equipment-slot {
            aspect-ratio: 1;
            background: var(--rs-brown-darkest);
            border: 2px solid var(--rs-border-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }

        .equipment-slot:hover {
            border-color: var(--rs-gold);
        }

        .equipment-slot.head { grid-column: 2; grid-row: 1; }
        .equipment-slot.cape { grid-column: 1; grid-row: 2; }
        .equipment-slot.neck { grid-column: 2; grid-row: 2; }
        .equipment-slot.ammo { grid-column: 3; grid-row: 1; }
        .equipment-slot.weapon { grid-column: 1; grid-row: 3; }
        .equipment-slot.body { grid-column: 2; grid-row: 3; }
        .equipment-slot.shield { grid-column: 3; grid-row: 3; }
        .equipment-slot.legs { grid-column: 2; grid-row: 4; }
        .equipment-slot.gloves { grid-column: 1; grid-row: 4; }
        .equipment-slot.boots { grid-column: 3; grid-row: 4; }

        /* Chat Box */
        #chat-box {
            position: absolute;
            bottom: 0;
            left: 0;
            width: calc(100% - 250px);
            height: 120px;
            background: var(--rs-brown-med);
            border-top: 3px solid var(--rs-gold);
            display: flex;
            flex-direction: column;
        }

        #chat-tabs {
            display: flex;
            background: var(--rs-brown-darkest);
            border-bottom: 2px solid var(--rs-border-dark);
        }

        .chat-tab {
            padding: 5px 15px;
            background: var(--rs-stone);
            border-right: 1px solid var(--rs-border-dark);
            cursor: pointer;
            font-size: 11px;
            color: var(--rs-text-yellow);
        }

        .chat-tab.active {
            background: var(--rs-brown-med);
            color: var(--rs-text-white);
        }

        #chat-messages {
            flex: 1;
            padding: 5px 10px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.4;
        }

        #chat-input-container {
            display: flex;
            padding: 5px;
            background: var(--rs-brown-darkest);
            border-top: 1px solid var(--rs-border-dark);
        }

        #chat-input {
            flex: 1;
            background: var(--rs-brown-darkest);
            border: 2px solid var(--rs-border-dark);
            color: var(--rs-text-white);
            padding: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        #chat-input:focus {
            outline: none;
            border-color: var(--rs-gold);
        }

        .chat-message {
            margin-bottom: 3px;
        }

        .chat-message.server { color: var(--rs-text-orange); }
        .chat-message.player { color: var(--rs-text-cyan); }
        .chat-message.game { color: var(--rs-text-white); }
        .chat-message.combat { color: var(--rs-text-red); }
        .chat-message.xp { color: var(--rs-text-green); }

        /* Stats Panel */
        #stats-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stat-item {
            background: var(--rs-brown-darkest);
            padding: 8px;
            border: 1px solid var(--rs-border-dark);
        }

        .stat-label {
            color: var(--rs-text-yellow);
            font-size: 11px;
        }

        .stat-value {
            color: var(--rs-text-white);
            font-size: 14px;
            font-weight: bold;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: var(--rs-brown-darkest);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--rs-stone);
            border: 1px solid var(--rs-border-dark);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--rs-brown-light);
        }

        /* FPS Counter */
        #fps-counter {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #0f0;
            padding: 5px 10px;
            font-size: 12px;
            font-family: monospace;
            border: 1px solid #0f0;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Main Canvas Area -->
        <div id="canvas-area">
            <canvas id="game-canvas"></canvas>

            <!-- Loading Screen -->
            <div id="loading-screen">
                <div class="loading-logo">🏰 RUSTSCAPE</div>
                <div class="loading-bar">
                    <div class="loading-progress" id="loading-progress"></div>
                </div>
                <div class="loading-text" id="loading-text">Loading game assets...</div>
            </div>

            <!-- FPS Counter -->
            <div id="fps-counter">FPS: 60</div>

            <!-- Minimap -->
            <div id="minimap-container">
                <div id="compass">N</div>
                <canvas id="minimap-canvas" width="180" height="180"></canvas>
            </div>

            <!-- XP Orbs -->
            <div id="xp-orbs">
                <div class="xp-orb hp" title="Hitpoints">
                    <span class="orb-value" id="hp-orb">100</span>
                </div>
                <div class="xp-orb prayer" title="Prayer">
                    <span class="orb-value" id="prayer-orb">0</span>
                </div>
                <div class="xp-orb run" title="Run Energy">
                    <span class="orb-value" id="run-orb">100</span>
                </div>
            </div>

            <!-- Chat Box -->
            <div id="chat-box">
                <div id="chat-tabs">
                    <div class="chat-tab active" data-tab="all">All</div>
                    <div class="chat-tab" data-tab="game">Game</div>
                    <div class="chat-tab" data-tab="public">Public</div>
                    <div class="chat-tab" data-tab="private">Private</div>
                </div>
                <div id="chat-messages"></div>
                <div id="chat-input-container">
                    <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
                </div>
            </div>
        </div>

        <!-- Right Sidebar -->
        <div id="sidebar">
            <!-- Tab Buttons -->
            <div id="tab-buttons">
                <button class="tab-btn" data-tab="combat" title="Combat">⚔️</button>
                <button class="tab-btn active" data-tab="stats" title="Stats">📊</button>
                <button class="tab-btn" data-tab="quest" title="Quests">📜</button>
                <button class="tab-btn" data-tab="inventory" title="Inventory">🎒</button>
                <button class="tab-btn" data-tab="equipment" title="Equipment">👕</button>
                <button class="tab-btn" data-tab="prayer" title="Prayer">🙏</button>
                <button class="tab-btn" data-tab="spellbook" title="Magic">✨</button>
            </div>

            <!-- Tab Content -->
            <div id="tab-content">
                <!-- Combat Tab -->
                <div class="tab-panel" id="combat-panel">
                    <div class="panel-title">Combat Options</div>
                    <div id="combat-content">
                        <!-- Combat styles will go here -->
                    </div>
                </div>

                <!-- Stats Tab -->
                <div class="tab-panel active" id="stats-panel">
                    <div class="panel-title">Player Stats</div>
                    <div id="stats-content">
                        <div class="stat-item">
                            <div class="stat-label">Position</div>
                            <div class="stat-value" id="stat-position">0, 0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Combat Level</div>
                            <div class="stat-value" id="stat-combat">3</div>
                        </div>
                    </div>
                </div>

                <!-- Quest Tab -->
                <div class="tab-panel" id="quest-panel">
                    <div class="panel-title">Quest Journal</div>
                    <div id="quest-content">
                        <!-- Quests will go here -->
                    </div>
                </div>

                <!-- Inventory Tab -->
                <div class="tab-panel" id="inventory-panel">
                    <div class="panel-title">Inventory</div>
                    <div id="inventory-grid">
                        <!-- 28 inventory slots -->
                    </div>
                </div>

                <!-- Equipment Tab -->
                <div class="tab-panel" id="equipment-panel">
                    <div class="panel-title">Equipment</div>
                    <div id="equipment-container">
                        <div class="equipment-slot head" data-slot="head" title="Head"></div>
                        <div class="equipment-slot cape" data-slot="cape" title="Cape"></div>
                        <div class="equipment-slot neck" data-slot="neck" title="Neck"></div>
                        <div class="equipment-slot ammo" data-slot="ammo" title="Ammo"></div>
                        <div class="equipment-slot weapon" data-slot="weapon" title="Weapon"></div>
                        <div class="equipment-slot body" data-slot="body" title="Body"></div>
                        <div class="equipment-slot shield" data-slot="shield" title="Shield"></div>
                        <div class="equipment-slot legs" data-slot="legs" title="Legs"></div>
                        <div class="equipment-slot gloves" data-slot="gloves" title="Gloves"></div>
                        <div class="equipment-slot boots" data-slot="boots" title="Boots"></div>
                    </div>
                </div>

                <!-- Prayer Tab -->
                <div class="tab-panel" id="prayer-panel">
                    <div class="panel-title">Prayer</div>
                    <div id="prayer-content">
                        <!-- Prayers will go here -->
                    </div>
                </div>

                <!-- Spellbook Tab -->
                <div class="tab-panel" id="spellbook-panel">
                    <div class="panel-title">Spellbook</div>
                    <div id="spellbook-content">
                        <!-- Spells will go here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Load Three.js and game modules -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
