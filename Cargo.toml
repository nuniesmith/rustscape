[package]
name = "rustscape"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web server (handles HTTP + WebSocket)
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
dashmap = "5"           # Concurrent HashMap (no locks needed)
bytes = "1"             # Efficient byte handling
futures = "0.3"
once_cell = "1.19"      # Lazy static initialization
rand = "0.8"            # Random number generation for combat

# Optional: SQLite if you want persistence later
# rusqlite = { version = "0.31", features = ["bundled"], optional = true }

[profile.dev]
opt-level = 1  # Faster dev builds but still debuggable

[profile.release]
lto = true
codegen-units = 1
