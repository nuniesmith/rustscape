<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rustscape Test Client</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        h1 {
            color: #4ec9b0;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .panel {
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            padding: 15px;
        }
        .panel h2 {
            margin-top: 0;
            color: #569cd6;
            font-size: 16px;
            border-bottom: 1px solid #3e3e42;
            padding-bottom: 10px;
        }
        input, button, textarea {
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        input, textarea {
            background: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid #3e3e42;
            padding: 8px;
            border-radius: 3px;
            width: calc(100% - 18px);
            margin-bottom: 10px;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 3px;
            cursor: pointer;
            margin-right: 5px;
        }
        button:hover {
            background: #1177bb;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .status {
            padding: 10px;
            border-radius: 3px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .status.connected {
            background: #1e3a1e;
            color: #4ec9b0;
        }
        .status.disconnected {
            background: #3a1e1e;
            color: #f48771;
        }
        #log {
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            padding: 10px;
            height: 400px;
            overflow-y: auto;
            font-size: 12px;
            border-radius: 3px;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #555;
            padding-left: 10px;
        }
        .log-entry.sent {
            border-left-color: #569cd6;
            background: #1e2a3a;
        }
        .log-entry.received {
            border-left-color: #4ec9b0;
            background: #1e3a2a;
        }
        .log-entry.error {
            border-left-color: #f48771;
            background: #3a1e1e;
        }
        .log-entry.info {
            border-left-color: #dcdcaa;
            background: #2a2a1e;
        }
        .log-time {
            color: #858585;
            font-size: 11px;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        .actions button {
            margin-bottom: 5px;
        }
        #playerInfo {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 3px;
            font-size: 12px;
        }
        .info-item {
            margin: 5px 0;
        }
        .info-label {
            color: #858585;
        }
        .info-value {
            color: #4ec9b0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1></h1>🎮 Rustscape Test Client</h1>

    <div class="status" id="status">
        <span id="statusText">Disconnected</span>
    </div>

    <div class="container">
        <!-- Connection Panel -->
        <div class="panel">
            <h2>Connection</h2>
            <input type="text" id="wsUrl" value="ws://localhost:8080/ws" placeholder="WebSocket URL">
            <input type="text" id="username" value="TestPlayer" placeholder="Username">
            <input type="password" id="password" value="password123" placeholder="Password">
            <div></div>
                <button id="connectBtn" onclick="connect()">Connect</button>
                <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
            </div>
        </div>

        <!-- Player Info Panel -->
        <div class="panel">
            <h2>Player Info</h2>
            <div id="playerInfo">
                <div class="info-item">Not logged in</div>
            </div>
        </div>

        <!-- Actions Panel -->
        <div class="panel">
            <h2>Actions</h2>
            <div class="actions">
                <button onclick="sendLogin()" disabled id="loginBtn">Login</button>
                <button onclick="requestPlayers()" disabled id="playersBtn">Request Players</button>
                <button onclick="requestNpcs()" disabled id="npcsBtn">Request NPCs</button>
                <button onclick="sendPing()" disabled id="pingBtn">Ping</button>
            </div>
            <h3 style="font-size: 14px; margin-top: 20px;">Movement</h3>
            <input type="number" id="moveX" placeholder="X" value="3222" style="width: 80px;">
            <input type="number" id="moveY" placeholder="Y" value="3218" style="width: 80px;">
            <button onclick="sendMove()" disabled id="moveBtn">Move</button>
            <h3 style="font-size: 14px; margin-top: 20px;">Chat</h3>
            <input type="text" id="chatMsg" placeholder="Message" onkeypress="if(event.key==='Enter')sendChat()">
            <button onclick="sendChat()" disabled id="chatBtn">Send</button>
        </div>

        <!-- Raw Packet Panel -->
        <div class="panel">
            <h2>Send Raw JSON</h2>
            <textarea id="rawJson" rows="10" placeholder='{"type": "Ping", "timestamp": 1234567890}'></textarea>
            <button onclick="sendRaw()" disabled id="rawBtn">Send Raw</button>
            <button onclick="fillSamplePackets()">Load Samples</button>
        </div>

        <!-- Log Panel -->
        <div class="panel full-width">
            <h2>Message Log</h2>
            <button onclick="clearLog()">Clear Log</button>
            <div id="log"></div>
        </div>
    </div>

    <script>
        let ws = null;
        let playerData = {};

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;

            const time = new Date().toLocaleTimeString();
            const timeSpan = document.createElement('span');
            timeSpan.className = 'log-time';
            timeSpan.textContent = `[${time}] `;

            entry.appendChild(timeSpan);

            if (typeof message === 'object') {
                entry.appendChild(document.createTextNode(JSON.stringify(message, null, 2)));
            } else {
                entry.appendChild(document.createTextNode(message));
            }

            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        function updateStatus(connected) {
            const status = document.getElementById('status');
            const statusText = document.getElementById('statusText');

            if (connected) {
                status.className = 'status connected';
                statusText.textContent = '🟢 Connected';
            } else {
                status.className = 'status disconnected';
                statusText.textContent = '🔴 Disconnected';
            }

            // Enable/disable buttons
            document.getElementById('connectBtn').disabled = connected;
            document.getElementById('disconnectBtn').disabled = !connected;
            document.getElementById('loginBtn').disabled = !connected;
            document.getElementById('playersBtn').disabled = !connected;
            document.getElementById('npcsBtn').disabled = !connected;
            document.getElementById('pingBtn').disabled = !connected;
            document.getElementById('moveBtn').disabled = !connected;
            document.getElementById('chatBtn').disabled = !connected;
            document.getElementById('rawBtn').disabled = !connected;
        }

        function updatePlayerInfo(data) {
            playerData = { ...playerData, ...data };
            const infoDiv = document.getElementById('playerInfo');

            if (playerData.player_id) {
                infoDiv.innerHTML = `
                    <div class="info-item">
                        <span class="info-label">Player ID:</span>
                        <span class="info-value">${playerData.player_id}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Username:</span>
                        <span class="info-value">${document.getElementById('username').value}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Position:</span>
                        <span class="info-value">(${playerData.position?.x}, ${playerData.position?.y}, ${playerData.position?.z})</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">HP Level:</span>
                        <span class="info-value">${playerData.skills?.hitpoints?.[0] || 'N/A'}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Server Tick:</span>
                        <span class="info-value">${playerData.tick || 'N/A'}</span>
                    </div>
                `;
            }
        }

        function connect() {
            const url = document.getElementById('wsUrl').value;
            log(`Connecting to ${url}...`, 'info');

            try {
                ws = new WebSocket(url);

                ws.onopen = () => {
                    log('WebSocket connected!', 'info');
                    updateStatus(true);
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        log(data, 'received');

                        // Handle specific message types
                        if (data.type === 'Welcome') {
                            updatePlayerInfo({ tick: data.tick });
                        } else if (data.type === 'LoginSuccess') {
                            updatePlayerInfo(data);
                        } else if (data.type === 'Pong') {
                            const latency = Date.now() - data.timestamp;
                            log(`Pong received! Latency: ${latency}ms, Server tick: ${data.server_tick}`, 'info');
                        }
                    } catch (e) {
                        log(`Received: ${event.data}`, 'received');
                    }
                };

                ws.onerror = (error) => {
                    log(`WebSocket error: ${error}`, 'error');
                };

                ws.onclose = () => {
                    log('WebSocket disconnected', 'info');
                    updateStatus(false);
                    ws = null;
                };
            } catch (e) {
                log(`Connection error: ${e.message}`, 'error');
            }
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function send(packet) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('Not connected!', 'error');
                return;
            }

            const json = JSON.stringify(packet);
            ws.send(json);
            log(packet, 'sent');
        }

        function sendLogin() {
            send({
                type: 'Login',
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            });
        }

        function sendMove() {
            send({
                type: 'Move',
                x: parseInt(document.getElementById('moveX').value),
                y: parseInt(document.getElementById('moveY').value)
            });
        }

        function sendChat() {
            const msg = document.getElementById('chatMsg').value;
            if (msg) {
                send({
                    type: 'Chat',
                    message: msg
                });
                document.getElementById('chatMsg').value = '';
            }
        }

        function requestPlayers() {
            send({ type: 'RequestPlayers' });
        }

        function requestNpcs() {
            send({ type: 'RequestNpcs' });
        }

        function sendPing() {
            send({
                type: 'Ping',
                timestamp: Date.now()
            });
        }

        function sendRaw() {
            try {
                const json = document.getElementById('rawJson').value;
                const packet = JSON.parse(json);
                send(packet);
            } catch (e) {
                log(`Invalid JSON: ${e.message}`, 'error');
            }
        }

        function fillSamplePackets() {
            document.getElementById('rawJson').value = JSON.stringify({
                type: 'Ping',
                timestamp: Date.now()
            }, null, 2);
        }

        // Auto-connect on load (optional)
        // window.onload = () => connect();
    </script>
</body>
</html>
